<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Users</title>
    <meta charset="UTF-8">
</head>
<body>

<h1>Users</h1>

<a th:href="@{/}">
    Home
</a>

<br><br>

<a th:href="@{/users/new}">
    Create User
</a>

<br><br>

<table border="1">

    <tr>
        <th>ID</th>
        <th>Full Name</th>
        <th>Email</th>
        <th>Actions</th>
    </tr>

    <tr th:each="user : ${users}">

        <td th:text="${user.id}"></td>

        <td th:text="${user.fullName}"></td>

        <td th:text="${user.email}"></td>

        <td>
            <a th:href="@{/users/delete/{id}(id=${user.id})}">
                Delete
            </a>
        </td>

    </tr>

</table>

</body>
</html>
